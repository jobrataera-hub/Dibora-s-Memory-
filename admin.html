<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dibora — Private Memory Editor</title><link rel="stylesheet" href="/style.css"><style>.admin-wrap{max-width:1000px;margin:auto;padding:30px 16px 80px}.admin-head{display:flex;justify-content:space-between;align-items:center}.admin-head h1{font:48px "Cormorant Garamond",serif}.admin-card{background:#1b0e2a;border:1px solid #e4b74c26;border-radius:24px;padding:22px;margin-bottom:18px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.admin-card label{font-size:12px;color:#c9bfca;font-weight:700}.admin-memory{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center;padding:12px;border-radius:16px;background:#12091d;margin:10px 0}.admin-memory img,.admin-memory video{width:120px;height:90px;object-fit:cover;border-radius:12px}.danger{background:#5a1736;color:#fff;border:0;border-radius:999px;padding:10px 15px}.hidden{display:none}@media(max-width:700px){.admin-grid{grid-template-columns:1fr}.admin-memory{grid-template-columns:80px 1fr}.admin-memory img,.admin-memory video{width:80px;height:70px}.admin-memory .actions{grid-column:1/-1}}</style></head><body>
<header class="topbar"><a class="brand" href="/">Dibora</a><a class="btn ghost" href="/">View site</a></header><main class="admin-wrap">
<div class="admin-head"><div><p class="eyebrow">PRIVATE AREA</p><h1>Memory Editor</h1></div><button id="logout" class="btn ghost hidden">Sign out</button></div>
<section id="loginCard" class="admin-card"><h2>Admin sign in</h2><p>Only a Firebase account with the <code>admin=true</code> custom claim can edit content.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="btn primary">Sign in</button><p id="loginStatus" class="status"></p></form></section>
<section id="adminApp" class="hidden">
<section class="admin-card"><p class="eyebrow">NEW CHAPTER</p><h2>Add / edit a memory</h2><form id="memoryForm"><input id="memoryId" type="hidden"><div class="admin-grid"><div><label>Title</label><input id="title" maxlength="100" required></div><div><label>Date label</label><input id="dateLabel" maxlength="80" placeholder="May 11, 2024"></div></div><label>Description</label><textarea id="description" rows="4" maxlength="1200" required></textarea><div class="admin-grid"><div><label>Sort date</label><input id="dateSort" type="date" required></div><div><label>Category</label><select id="category"><option>Childhood</option><option>School</option><option>Achievement</option><option>Family</option><option>Adventure</option><option>Today</option><option>Future</option></select></div></div><label>Photo or video</label><input id="media" type="file" accept="image/*,video/*"><label><input id="published" type="checkbox" checked> Published</label><div><button class="btn primary">Save memory</button> <button id="cancelEdit" class="btn ghost" type="button">Clear</button></div><p id="memoryStatus" class="status"></p></form></section>
<section class="admin-card"><p class="eyebrow">MODERATION</p><h2>Guest wishes</h2><div id="wishesAdmin"></div></section>
<section class="admin-card"><p class="eyebrow">ARCHIVE</p><h2>Memories</h2><div id="memoryAdmin"></div></section>
</section></main><script type="module" src="/admin.js"></script></body></html>
